# Spacepad by JB Praise — version Mac : application + plugins Audio Unit et VST3 (Apple Silicon + Intel),
# tests (dont auval, le test officiel d'Apple), installateur .pkg testé sur une vraie installation.
# Résultat : branche « ci-spacepad-mac » (Spacepad-<version>.pkg + journaux).
# Lancer : onglet « Actions » > « Spacepad Mac » > « Run workflow » (on peut choisir le modèle de Mac).
name: Spacepad Mac
# Pour l'instant : seulement au lancement manuel (on termine d'abord la version Windows)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Machine Mac de GitHub (macos-15-intel, macos-15, macos-14, macos-latest…)"
        default: macos-15-intel
        required: false
permissions:
  contents: write
env:
  SPVER: "1.0.0"
jobs:
  mac:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Construction universelle (Apple Silicon + Intel)
        run: |
          mkdir -p /tmp/splogs
          sw_vers | tee /tmp/splogs/00_systeme.txt
          cmake -S spacepad -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" 2>&1 | tail -3
          cmake --build build --target Spacepad_Standalone Spacepad_VST3 Spacepad_AU SpacepadTests 2>&1 | tee /tmp/splogs/01_construction.txt | grep -E " error|FAILED" || true
          A=build/Spacepad_artefacts/Release
          ls -la $A/Standalone $A/VST3 $A/AU | tee -a /tmp/splogs/01_construction.txt
          for b in "$A/Standalone/Spacepad.app" "$A/VST3/Spacepad.vst3" "$A/AU/Spacepad.component"; do
            codesign --force --deep -s - "$b"
            lipo -archs "$b/Contents/MacOS/Spacepad" | sed "s|^|$b : |" | tee -a /tmp/splogs/01_construction.txt
          done
      - name: Tests
        run: |
          mkdir -p /tmp/splogs/captures
          build/SpacepadTests_artefacts/Release/SpacepadTests /tmp/splogs/captures 2>&1 | tee /tmp/splogs/02_tests.txt
      - name: Test officiel Apple de l'Audio Unit (auval, Apple et Intel)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Spacepad_artefacts/Release/AU/Spacepad.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aumu Spcp JBPr 2>&1 | tee /tmp/splogs/03_auval.txt | tail -15
          grep -q "AU VALIDATION SUCCEEDED" /tmp/splogs/03_auval.txt
          [ "$(uname -m)" = arm64 ] && { arch -x86_64 auval -v aumu Spcp JBPr > /tmp/splogs/03b_auval_intel.txt 2>&1 || true; } || echo "machine Intel : auval ci-dessus = version Intel" > /tmp/splogs/03b_auval_intel.txt
          tail -5 /tmp/splogs/03b_auval_intel.txt
      - name: Test « faux Logic Pro » et gardien Logic Pro 13
        shell: bash {0}
        run: |
          # comme pour Layers Keys : le plugin est chargé comme Logic le fait (notes décalées, état du projet, fenêtre
          # ouverte / fermée / rouverte comme Logic 13) ; le gardien compte les signaux pendant 12 s de jeu
          # (Logic Pro 13 prend tout signal pour un plantage : il ne doit y en avoir AUCUN)
          clang -fobjc-arc -arch arm64 -arch x86_64 spacepad/tools/au_logic_test.m -o /tmp/au_logic_test \
            -framework AudioToolbox -framework AppKit -framework CoreAudioKit -framework CoreMIDI 2>&1 | tail -5
          HOSTA=$(uname -m)
          echo "=== test Logic ($HOSTA)" > /tmp/splogs/03c_logic.txt
          /tmp/au_logic_test >> /tmp/splogs/03c_logic.txt 2>&1; echo "EXIT $?" >> /tmp/splogs/03c_logic.txt
          echo "=== gardien Logic Pro 13 ($HOSTA)" > /tmp/splogs/03d_gardien.txt
          /tmp/au_logic_test --gardien >> /tmp/splogs/03d_gardien.txt 2>&1; G=$?; echo "EXIT $G" >> /tmp/splogs/03d_gardien.txt
          if [ "$HOSTA" = arm64 ]; then
            echo "=== gardien Intel (Rosetta)" >> /tmp/splogs/03d_gardien.txt
            arch -x86_64 /tmp/au_logic_test --gardien >> /tmp/splogs/03d_gardien.txt 2>&1; echo "EXIT $?" >> /tmp/splogs/03d_gardien.txt
          fi
          cat /tmp/splogs/03c_logic.txt /tmp/splogs/03d_gardien.txt
          rm -rf ~/Library/Audio/Plug-Ins/Components/Spacepad.component
          [ $G -eq 0 ]
      - name: Test de démarrage de l'application (Apple et Intel)
        shell: bash {0}
        run: |
          B=build/Spacepad_artefacts/Release/Standalone/Spacepad.app/Contents/MacOS/Spacepad
          # on ne peut lancer que l'architecture de la machine (un Mac Intel ne fait pas tourner le code Apple Silicon)
          HOSTA=$(uname -m); [ "$HOSTA" = arm64 ] && ARCHS="arm64 x86_64" || ARCHS="x86_64"
          for a in $ARCHS; do
            arch -$a "$B" > /tmp/splogs/04_run_$a.txt 2>&1 &
            P=$!; sleep 6
            if kill -0 $P 2>/dev/null; then echo "$a : application en marche après 6 s : OK" | tee -a /tmp/splogs/04_app.txt; kill $P; else wait $P; echo "$a : PLANTÉ code $?" | tee -a /tmp/splogs/04_app.txt; fi
          done
      - name: Installateur .pkg
        run: |
          mkdir -p /tmp/in
          A=build/Spacepad_artefacts/Release
          cp -R $A/Standalone/Spacepad.app $A/VST3/Spacepad.vst3 $A/AU/Spacepad.component /tmp/in/
          spacepad/installer/mac/build_pkg.sh /tmp/in "$SPVER" 2>&1 | tee /tmp/splogs/05_pkg.txt
      - name: Test installation complète
        run: |
          {
            sudo installer -pkg spacepad/dist/Spacepad-$SPVER.pkg -target / 2>&1 | tail -5
            for x in "/Applications/Spacepad.app/Contents/MacOS/Spacepad" "/Applications/Désinstaller Spacepad.app/Contents/Resources/desinstaller.sh" "/Library/Audio/Plug-Ins/VST3/Spacepad.vst3/Contents/MacOS/Spacepad" "/Library/Audio/Plug-Ins/Components/Spacepad.component/Contents/MacOS/Spacepad" "/Library/Application Support/JB Praise/Spacepad"; do
              [ -e "$x" ] && echo "présent : $x" || echo "ABSENT : $x"
            done
            ls -ld "/Library/Application Support/JB Praise/Spacepad"
            pkgutil --pkgs | grep spacepad
            sleep 3
            auval -v aumu Spcp JBPr 2>&1 | tail -3
            sudo /bin/bash "/Applications/Désinstaller Spacepad.app/Contents/Resources/desinstaller.sh" --silent
            [ -e /Applications/Spacepad.app ] && echo "ERREUR : encore installé" || echo "désinstallation : OK"
          } 2>&1 | tee /tmp/splogs/06_installation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Spacepad_Mac
          path: spacepad/dist/Spacepad-*.pkg
      - name: Publier (branche ci-spacepad-mac)
        if: always()
        run: |
          mkdir -p /tmp/o
          cp -R /tmp/splogs/* /tmp/o/ 2>/dev/null || true
          cp spacepad/dist/Spacepad-*.pkg /tmp/o/ 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-spacepad-mac-tmp
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf build spacepad
          cp -R /tmp/o/* . 2>/dev/null || true
          echo "run $GITHUB_RUN_ID" > run.txt
          git add -A && git commit -qm "spacepad mac $GITHUB_RUN_ID"
          # sans installateur (un test a échoué) : seulement les journaux, le lien de téléchargement reste intact
          target=ci-spacepad-mac
          ls Spacepad-*.pkg >/dev/null 2>&1 || target=ci-spacepad-mac-echec
          git push -f origin HEAD:refs/heads/$target

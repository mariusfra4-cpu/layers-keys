# Construit l'APK Eli Guitar Chords et le teste dans un émulateur.
# Résultats : branche « ci-eli » (APK) et « ci-eli-test » (captures d'écran et journaux).
name: Eli Guitar Chords Android
on:
  push:
    paths: ['eli-guitar-app/**', 'eli-keygen/**', '.github/workflows/eli.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'APK
        run: VCODE=${{ github.run_number }} ./eli-guitar-app/build.sh 2>&1 | tee /tmp/build.txt
      - name: APK de test (clé publique de test, jamais distribué)
        run: |
          OUT=$PWD/eli-guitar-app/build_test APKNAME=eliguitarchords-test TEST_KEY=1 \
            ./eli-guitar-app/build.sh 2>&1 | tail -3
      - name: Générateur Eli Clés (vrai) et version de test (mot de passe TEST-TEST-TEST-TEST)
        run: |
          VCODE=${{ github.run_number }} ./eli-keygen/build.sh 2>&1 | tail -3
          OUT=build_test SECRET_JAVA=$PWD/eli-keygen/test/SecretTest.java ./eli-keygen/build.sh 2>&1 | tail -2
          mv eli-keygen/build_test/eliclees.apk eli-keygen/build_test/eliclees-test.apk
      - name: Vérification croisée générateur -> appli (Java)
        run: |
          set -e
          mkdir -p /tmp/kc
          cp eli-keygen/test/SecretTest.java /tmp/kc/Secret.java
          javac -nowarn -d /tmp/kc eli-keygen/src/com/elipraise/keygen/KeyCore.java /tmp/kc/Secret.java eli-keygen/test/CrossTest.java eli-keygen/test/SecretAccess.java eli-guitar-app/build_test/src/com/elipraise/guitarchords/EdKey.java
          java -cp /tmp/kc com.elipraise.guitarchords.CrossTest | tee /tmp/croise.txt
      - name: Contenu
        run: |
          set -e
          unzip -l eli-guitar-app/build/eliguitarchords.apk | tee /tmp/contenu.txt
          # l'APK distribué n'a pas la permission Internet et contient la vraie clé publique (pas celle de test)
          A2=$(ls -d "$ANDROID_HOME"/build-tools/* | grep -v rc | sort -V | tail -1)/aapt2
          "$A2" dump permissions eli-guitar-app/build/eliguitarchords.apk | tee -a /tmp/contenu.txt
          if "$A2" dump permissions eli-guitar-app/build/eliguitarchords.apk 2>/dev/null | grep -q INTERNET; then echo "ERREUR : permission Internet"; exit 1; fi
          if grep -q "$(cut -c1-40 eli-guitar-app/test/test-public.txt)" eli-guitar-app/build/src/com/elipraise/guitarchords/EdKey.java; then echo "ERREUR : clé de test dans l'APK distribué"; exit 1; fi
          echo "contenu vérifié" | tee -a /tmp/contenu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eli-apk
          path: |
            eli-guitar-app/build/eliguitarchords.apk
            eli-guitar-app/build_test/eliguitarchords-test.apk
            eli-keygen/build/eliclees.apk
            eli-keygen/build_test/eliclees-test.apk
      - name: Publier
        if: always()
        run: |
          mkdir -p /tmp/o
          cp eli-guitar-app/build/eliguitarchords.apk /tmp/o/Eli-Guitar-Chords.apk 2>/dev/null || true
          cp eli-keygen/build/eliclees.apk /tmp/o/Eli-Cles-Generateur.apk 2>/dev/null || true
          cp /tmp/build.txt /tmp/contenu.txt /tmp/croise.txt /tmp/o/ 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-eli-tmp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdxq
          cp /tmp/o/* . 2>/dev/null || true
          echo "run $GITHUB_RUN_ID" > run.txt
          git add -A && git commit -qm "eli apk $GITHUB_RUN_ID"
          git push -f origin HEAD:refs/heads/ci-eli
  emulateur:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eli-apk
          path: /tmp/art
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          script: bash -c 'A=$(find /tmp/art -name eliguitarchords-test.apk); G=$(find /tmp/art -name eliclees-test.apk); for i in 1 2 3; do echo "=== passage $i"; OUT=/tmp/emu/passage$i bash eli-guitar-app/test/emu.sh "$A" "$G" || exit 1; done'
        env:
          OUT: /tmp/emu
      - name: Publier
        if: always()
        run: |
          mkdir -p /tmp/o; cp -r /tmp/emu/* /tmp/o/ 2>/dev/null || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-eli-test-tmp
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdxq
          cp -r /tmp/o/* . 2>/dev/null || true
          echo "run $GITHUB_RUN_ID" > run.txt
          git add -A && git commit -qm "test eli $GITHUB_RUN_ID"
          git push -f origin HEAD:refs/heads/ci-eli-test

# Construit la version Mac (application + plugins VST3 et Audio Unit + installateur .pkg) sur un vrai Mac de GitHub,
# puis fait des tests de démarrage. Lancer : onglet « Actions » > « Layers Keys Mac » > « Run workflow ».
# Les journaux de chaque étape sont publiés dans la branche « ci-logs ».
name: Layers Keys Mac
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Machine GitHub (macos-15 = Apple Silicon ; macos-15-intel si les Mac Apple Silicon sont saturés)"
        default: macos-15
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mac:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Préparation
        run: mkdir -p /tmp/lklogs && sw_vers | tee /tmp/lklogs/00_systeme.txt && go version | tee -a /tmp/lklogs/00_systeme.txt
      - name: Tests
        continue-on-error: true
        run: go test . 2>&1 | tee /tmp/lklogs/01_tests.txt | tail -20
      # Go 1.23 et plus récent : la version Intel (x86_64) de l'application plante au démarrage. Go 1.22 est sûr.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Application Mac
        run: ./build_mac.sh 2>&1 | tee /tmp/lklogs/02_app.txt | tail -20
      # Les plugins aussi doivent être construits avec Go 1.22 : avec Go 1.24, la version Intel (x86_64) plante au chargement (Logic, GarageBand, auval)
      - name: Plugin VST3 Mac
        run: ./build_mac_vst3.sh 2>&1 | tee /tmp/lklogs/03_vst3.txt | tail -30
      - name: Plugin Audio Unit Mac
        run: |
          ./build_mac_au.sh 2>&1 | tee /tmp/lklogs/04_au.txt | tail -60
          B=dist/mac/LayersKeys.component/Contents/MacOS/LayersKeys
          # la classe de l'interface doit être écrite DANS le plugin (sinon Logic / FL Studio affichent leur fenêtre grise)
          nm -arch x86_64 "$B" | grep 'OBJC_CLASS_\$_LKAUViewFactory' | tee -a /tmp/lklogs/04_au.txt
          nm -arch arm64 "$B" | grep 'OBJC_CLASS_\$_LKAUViewFactory' | tee -a /tmp/lklogs/04_au.txt
          # version minimale de macOS de chaque partie (doit être 11.0)
          (vtool -show-build "$B" 2>/dev/null || otool -l "$B" | grep -A4 LC_BUILD_VERSION) | grep -iE 'architecture|minos' | tee -a /tmp/lklogs/04_au.txt
      - name: Test officiel Apple de l'Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/mac/LayersKeys.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          set +e
          rm -f /tmp/lk_au_trace.txt
          LK_TRACE=1 auval -v aumu Lkys JBPr > dist/auval.txt 2>&1
          echo "auval EXIT=$?" >> dist/auval.txt
          cp dist/auval.txt /tmp/lklogs/05_auval.txt
          cp /tmp/lk_au_trace.txt /tmp/lklogs/05c_trace.txt 2>/dev/null || true
          sleep 2
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/* /Library/Logs/DiagnosticReports/* 2>/dev/null | head -3); do
            echo "=== rapport de plantage $f" >> /tmp/lklogs/05b_crash.txt
            head -c 12000 "$f" >> /tmp/lklogs/05b_crash.txt
          done
          tail -40 dist/auval.txt
      - name: Test officiel Apple de l'Audio Unit en version Intel (auval sous Rosetta)
        continue-on-error: true
        run: |
          set +e
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          lipo -archs dist/mac/LayersKeys.component/Contents/MacOS/LayersKeys | tee /tmp/lklogs/05d_auval_intel.txt
          arch -x86_64 auval -v aumu Lkys JBPr >> /tmp/lklogs/05d_auval_intel.txt 2>&1
          echo "auval Intel EXIT=$?" >> /tmp/lklogs/05d_auval_intel.txt
          tail -12 /tmp/lklogs/05d_auval_intel.txt
      - name: Test « comme Logic » de l'Audio Unit (notes décalées, état du projet, fenêtre du plugin)
        continue-on-error: true
        run: |
          set +e
          clang -fobjc-arc -arch arm64 -arch x86_64 tools/au_logic_test.m -o /tmp/au_logic_test \
            -framework AudioToolbox -framework AppKit -framework CoreAudioKit 2>&1 | tee /tmp/lklogs/05e_logic_test.txt
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          echo "=== natif ($(uname -m))" >> /tmp/lklogs/05e_logic_test.txt
          # perl alarm : si l'interface se bloque, le test est arrêté au bout de 120 s (au lieu de bloquer la construction)
          # lance le test ; s'il est encore là au bout de 90 s (blocage), on relève ce que fait chaque fil puis on l'arrête
          runwatch() { # nom, commande…
            local n=$1; shift
            "$@" >> /tmp/lklogs/05e_logic_test.txt 2>&1 &
            local p=$! k=0
            while kill -0 $p 2>/dev/null && [ $k -lt 90 ]; do sleep 1; k=$((k+1)); done
            if kill -0 $p 2>/dev/null; then
              echo "BLOCAGE ($n) : le test ne répond plus après 90 s" >> /tmp/lklogs/05e_logic_test.txt
              sample $p 3 -file /tmp/lklogs/05g_blocage_$n.txt >/dev/null 2>&1
              kill -9 $p; wait $p 2>/dev/null; return 124
            fi
            wait $p
          }
          runwatch natif /tmp/au_logic_test; A=$?
          echo "=== x86_64 (Intel, ou Rosetta sur Apple Silicon)" >> /tmp/lklogs/05e_logic_test.txt
          runwatch x86_64 arch -x86_64 /tmp/au_logic_test; I=$?
          echo "EXIT arm64=$A x86_64=$I" >> /tmp/lklogs/05e_logic_test.txt
          cp ~/Library/Logs/LayersKeys.log /tmp/lklogs/05f_journal_plugin.txt 2>/dev/null || true
          cat /tmp/lklogs/05e_logic_test.txt
          [ $A -eq 0 ] && [ $I -eq 0 ]
      - name: Test de démarrage du plugin VST3 (chargement + fabrique)
        continue-on-error: true
        run: |
          python3 - <<'PY' 2>&1 | tee /tmp/lklogs/06_vst3_charge.txt
          import ctypes
          lib = ctypes.CDLL("dist/mac/LayersKeys.vst3/Contents/MacOS/LayersKeys")
          f = lib.GetPluginFactory
          f.restype = ctypes.c_void_p
          assert f(), "fabrique VST3 vide"
          print("Plugin chargé : fabrique VST3 OK")
          PY
      - name: Test de démarrage de l'application (Apple et Intel, 5 secondes sans plantage)
        continue-on-error: true
        shell: bash {0}
        run: |
          B="dist/mac/app/Layers Keys.app/Contents/MacOS/LayersKeys"
          lipo -archs "$B" | tee /tmp/lklogs/07_app_run.txt
          for a in arm64 x86_64; do
            arch -$a "$B" > /tmp/lklogs/07_run_$a.txt 2>&1 &
            P=$!
            sleep 6
            if kill -0 $P 2>/dev/null; then echo "$a : application en marche après 6 s : OK" | tee -a /tmp/lklogs/07_app_run.txt; kill $P; else wait $P; echo "$a : PLANTÉ code $?" | tee -a /tmp/lklogs/07_app_run.txt; fi
          done
      - name: Installateur .pkg
        run: ./build_mac_pkg.sh 2>&1 | tee /tmp/lklogs/08_pkg.txt | tail -20
      - name: Test du son (plugin de TEST déjà autorisé, jamais distribué) - après l'installateur
        continue-on-error: true
        run: |
          set +e
          # plugin de test construit à part : dist/ (les fichiers distribués) n'est pas touché
          T=/tmp/testau/LayersKeys.component
          rm -rf /tmp/testau && mkdir -p $T/Contents/MacOS /tmp/testau/b
          for a in arm64 amd64; do
            CGO_ENABLED=1 GOOS=darwin GOARCH=$a CC=clang MACOSX_DEPLOYMENT_TARGET=11.0 \
              CGO_CFLAGS="-O2 -mmacosx-version-min=11.0" CGO_LDFLAGS="-mmacosx-version-min=11.0" \
              go build -tags "au lktest" -buildmode=c-shared -trimpath -o /tmp/testau/b/LK_$a.dylib . 2>&1 | tail -5
          done
          lipo -create /tmp/testau/b/LK_arm64.dylib /tmp/testau/b/LK_amd64.dylib -output $T/Contents/MacOS/LayersKeys
          cp mac/au_Info.plist $T/Contents/Info.plist; printf 'BNDL????' > $T/Contents/PkgInfo
          codesign --force --deep --sign - $T
          rm -rf ~/Library/Audio/Plug-Ins/Components/LayersKeys.component
          cp -R $T ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null; sleep 3
          echo "=== natif ($(uname -m))" > /tmp/lklogs/05h_son.txt
          /tmp/au_logic_test --son >> /tmp/lklogs/05h_son.txt 2>&1; echo "EXIT $?" >> /tmp/lklogs/05h_son.txt
          echo "=== x86_64" >> /tmp/lklogs/05h_son.txt
          arch -x86_64 /tmp/au_logic_test --son >> /tmp/lklogs/05h_son.txt 2>&1; echo "EXIT $?" >> /tmp/lklogs/05h_son.txt
          rm -rf ~/Library/Audio/Plug-Ins/Components/LayersKeys.component
          cat /tmp/lklogs/05h_son.txt
      - name: Paquet
        run: |
          cd dist && rm -rf paquet && mkdir paquet
          cp -R mac/app/"Layers Keys.app" paquet/
          cp -R mac/LayersKeys.vst3 paquet/
          cp -R mac/LayersKeys.component paquet/
          cp auval.txt paquet/ 2>/dev/null || true
          cp ../mac/LISEZMOI_Mac.txt paquet/
          ditto -c -k --keepParent paquet LayersKeys_Mac_complet.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LayersKeys_Mac
          path: |
            dist/LayersKeys_Mac_complet.zip
            dist/LayersKeys_Mac_Installer.pkg
            dist/auval.txt
      - name: Publier les journaux (branche ci-logs)
        if: always()
        run: |
          mkdir -p /tmp/lklogs
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/lklogs/* . 2>/dev/null || true
          echo "run $GITHUB_RUN_ID" > run.txt
          git add -A
          git commit -m "journaux de construction $GITHUB_RUN_ID"
          git push -f origin HEAD:refs/heads/ci-logs

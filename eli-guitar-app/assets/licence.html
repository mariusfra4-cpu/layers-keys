<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eli Guitar Chords</title>
<style>
:root{--bg:#f8f5fd;--fg:#1d1b26;--mut:#6f6a80;--card:#fff;--ac:#6d28d9;--on:#fff;--bd:#e4dcf2;--ok:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#15121c;--fg:#f1edf9;--mut:#a59fb8;--card:#1f1a2b;--ac:#a78bfa;--on:#15121c;--bd:#372f4a;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px;text-align:center}
h1{font-size:28px;margin:0;font-weight:800}
.by{color:var(--ac);font-weight:600;font-size:14px;margin:2px 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;text-align:center}
.lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:6px}
.code{font:700 21px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;word-break:break-all;user-select:all}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;min-height:44px}
button.main{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700;width:100%}
button:disabled{opacity:.6}
#st{min-height:22px;margin:4px 0;font-weight:600}
#st.bad{color:var(--bad)}#st.ok{color:var(--ok)}
.sub{color:var(--mut);font-size:14px}
textarea{font:600 14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);resize:none;text-transform:uppercase;word-break:break-all}
input{font:inherit;font-size:18px;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);width:100%;margin-top:8px;text-transform:uppercase}
</style></head><body><main>
<img src="logo.png" alt="" width="96" height="96" style="display:block;margin:0 auto 10px;border-radius:22px;box-shadow:0 6px 18px rgba(76,29,149,.3)">
<h1>Eli Guitar Chords</h1><div class="by">by Eli Praise</div>
<div id="st">Cette application n’est pas encore activée sur ce téléphone.</div>
<div class="card">
 <div class="lab">Code de ce téléphone</div>
 <div class="code" id="code">…</div>
 <div class="row"><button id="copy">Copier</button><button id="share">Envoyer à Eli Praise</button></div>
 <p class="sub" style="margin:12px 0 0">1. Envoie ce code à Eli Praise.<br>2. Tu reçois ta clé de licence : colle-la ci-dessous.</p>
</div>
<div class="card">
 <div class="lab">Clé de licence</div>
 <textarea id="key" rows="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXX-XXXXXXXX-…"></textarea>
 <div class="row"><button id="paste">Coller ma clé</button></div>
 <button class="main" id="act" style="margin-top:10px">Activer</button>
</div>
<p class="sub">Aucune connexion Internet n’est nécessaire.</p>
</main>
<script>
const A=window.EliAndroid,$=id=>document.getElementById(id),st=$('st');
if(A){const i=JSON.parse(A.licenceInfo());$('code').textContent=i.code;if(i.open)A.openApp()}
else st.textContent='Ouvre l’application Eli Guitar Chords sur ton téléphone.';
$('copy').onclick=()=>A&&A.copyCode();
$('share').onclick=()=>A&&A.shareCode();
function act(){const k=$('key').value.trim();if(!k){st.className='bad';st.textContent='Colle d’abord la clé reçue d’Eli Praise.';return}
 if(A.activateKey(k)){st.className='ok';st.textContent='Licence activée ✓';setTimeout(()=>A.openApp(),400)}
 else{st.className='bad';st.textContent='Cette clé ne correspond pas à ce téléphone. Vérifie qu’elle a été faite avec le code affiché ci-dessus.'}}
$('act').onclick=act;
$('paste').onclick=()=>{const t=A&&A.clipboard();if(t){$('key').value=t.trim();act()}else{st.className='bad';st.textContent='Le presse-papiers est vide : copie la clé dans le message reçu.'}};
</script></body></html>
